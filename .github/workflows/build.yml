name: ONKOS File Transfer - Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar
        run: >
          msbuild ONKOSFileTransfer/ONKOSFileTransfer.csproj
          /p:Configuration=Release
          /p:Platform=AnyCPU

      - name: Publicar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: ONKOS-File-Transfer
          path: ONKOSFileTransfer/bin/Release/
          if-no-files-found: error
