name: Build ONKOS File Transfer 2.0

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages if present
        shell: pwsh
        run: |
          if (Test-Path "ONKOS_File_Transfer.sln") {
            nuget restore "ONKOS_File_Transfer.sln"
          }

      - name: Build ONKOS.Core (Release)
        run: msbuild ONKOS.Core/ONKOS.Core.csproj /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Build ONKOS.Service (Release)
        run: msbuild ONKOS.Service/ONKOS.Service.csproj /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Build ONKOS.UI (Release)
        run: msbuild ONKOS.UI/ONKOS.UI.csproj /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Build and run ONKOS.Tests (Release)
        shell: pwsh
        run: |
          msbuild ONKOS.Tests/ONKOS.Tests.csproj /p:Configuration=Release /p:Platform=AnyCPU /m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "ONKOS.Tests\bin\Release\ONKOS.Tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer with Inno Setup if available
        shell: pwsh
        run: |
          $isccPath = $null
          $cmd = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if ($cmd -and $cmd.Source) {
            $isccPath = $cmd.Source
          } else {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            foreach ($cand in $candidates) {
              if (Test-Path $cand) {
                $isccPath = $cand
                break
              }
            }
          }

          if ($isccPath -and (Test-Path "ONKOS_Setup.iss")) {
            & $isccPath "ONKOS_Setup.iss"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "ISCC.exe no encontrado en la imagen; se empaquetarán los binarios Release como artefacto."
          }

      - name: Stage release artifacts
        shell: pwsh
        run: |
          $stageDir = Join-Path $env:RUNNER_TEMP "onkos_release_stage"
          New-Item -ItemType Directory -Force -Path "$stageDir\UI" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stageDir\Servicio" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stageDir\Instalador" | Out-Null

          Copy-Item "ONKOS.UI\bin\Release\*" -Destination "$stageDir\UI" -Recurse -Force
          Copy-Item "ONKOS.Service\bin\Release\*" -Destination "$stageDir\Servicio" -Recurse -Force
          if (Test-Path "Output\*") {
            Copy-Item "Output\*" -Destination "$stageDir\Instalador" -Recurse -Force
          }

          Write-Output "STAGED_DIR=$stageDir" >> $env:GITHUB_ENV

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ONKOS-File-Transfer-2.0-Release
          path: ${{ env.STAGED_DIR }}
          if-no-files-found: warn
