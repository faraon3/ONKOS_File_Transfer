name: ONKOS File Transfer - Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar
        run: >
          msbuild ONKOSFileTransfer/ONKOSFileTransfer.csproj
          /p:Configuration=Release
          /p:Platform=AnyCPU

      - name: Verificar ejecutable
        shell: pwsh
        run: |
          $exe = "ONKOSFileTransfer/bin/Release/ONKOSFileTransfer.exe"
          if (!(Test-Path $exe)) {
            throw "No se encontró el ejecutable: $exe"
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Empaquetar ejecutable
        shell: pwsh
        run: |
          Compress-Archive -Path "ONKOSFileTransfer/bin/Release/*" -DestinationPath "ONKOS-File-Transfer.zip" -Force

      - name: Publicar GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ONKOS File Transfer - Build ${{ github.run_number }}
          body: |
            Compilación automática de ONKOS File Transfer.
            Descarga el ZIP y extrae su contenido antes de ejecutar.
          files: ONKOS-File-Transfer.zip
          make_latest: true
