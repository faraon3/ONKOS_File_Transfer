name: Build ONKOS File Transfer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar Interfaz Gráfica (Release)
        run: dotnet build ONKOSFileTransfer/ONKOSFileTransfer.csproj -c Release

      - name: Compilar Servicio de Windows (Release)
        run: dotnet build ONKOSTransferService/ONKOSTransferService.csproj -c Release

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Generar Instalador con Inno Setup
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "No se encontró ISCC.exe" }
          & $iscc "ONKOS_Setup.iss"

      - name: Publicar Instalador como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-ONKOS-File-Transfer
          path: Output/*.exe
          if-no-files-found: error
