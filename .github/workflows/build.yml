name: ONKOS File Transfer - Build

on:
  push:
    branches: [main, v2-architecture]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (!(Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          $innoPaths = @(
            "C:\Program Files (x86)\Inno Setup 6",
            "C:\Program Files\Inno Setup 6",
            "C:\Program Files (x86)\Inno Setup 5"
          )
          foreach ($p in $innoPaths) {
            if (Test-Path "$p\ISCC.exe") {
              "PATH=$p;$env:PATH" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "$p;$env:PATH"
              break
            }
          }
          Get-Command iscc.exe -ErrorAction Stop | Select-Object -ExpandProperty Source

      - name: Compilar ONKOS.Core
        run: >
          msbuild ONKOS.Core/ONKOS.Core.csproj
          /p:Configuration=Release
          /p:Platform=AnyCPU
          /m

      - name: Compilar ONKOS.Service
        run: >
          msbuild ONKOS.Service/ONKOS.Service.csproj
          /p:Configuration=Release
          /p:Platform=AnyCPU
          /m

      - name: Compilar ONKOS.UI
        run: >
          msbuild ONKOS.UI/ONKOS.UI.csproj
          /p:Configuration=Release
          /p:Platform=AnyCPU
          /m

      - name: Compilar y ejecutar ONKOS.Tests
        run: |
          msbuild ONKOS.Tests/ONKOS.Tests.csproj /p:Configuration=Release /p:Platform=AnyCPU /m
          ONKOS.Tests\bin\Release\ONKOS.Tests.exe

      - name: Verificar compilaciones
        shell: pwsh
        run: |
          $gui = "ONKOS.UI/bin/Release/ONKOSFileTransfer.exe"
          $service = "ONKOS.Service/bin/Release/ONKOS.TransferService.exe"
          if (!(Test-Path $gui)) { throw "No se encontró la interfaz: $gui" }
          if (!(Test-Path $service)) { throw "No se encontró el servicio: $service" }
          Get-Item $gui, $service | Select-Object FullName, Length

      - name: Compilar Instalador EXE con Inno Setup
        run: iscc ONKOS_Setup.iss

      - name: Preparar paquete ZIP de respaldo
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Interfaz, package/Servicio | Out-Null
          Copy-Item "ONKOS.UI/bin/Release/*" package/Interfaz/ -Recurse -Force
          Copy-Item "ONKOS.Service/bin/Release/*" package/Servicio/ -Recurse -Force
          Copy-Item "ONKOSFileTransfer/recibidos.ico" package/recibidos.ico -Force
          Copy-Item "ONKOSFileTransfer/onkos.ico" package/Interfaz/onkos.ico -Force
          Compress-Archive -Path "package/*" -DestinationPath "ONKOS-File-Transfer-V2.zip" -Force

      - name: Publicar versión preliminar V2
        if: ${{ github.ref == 'refs/heads/v2-architecture' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2-preview-${{ github.run_number }}
          name: ONKOS File Transfer 2.0 - Prueba ${{ github.run_number }}
          body: |
            Versión preliminar de ONKOS File Transfer 2.0 (Fase 1) compilada desde la rama v2-architecture.
          files: |
            Output/Instalador_ONKOS_File_Transfer_2.0.exe
            ONKOS-File-Transfer-V2.zip
          prerelease: true
          make_latest: false
