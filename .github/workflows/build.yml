name: ONKOS File Transfer - Build

on:
  push:
    branches: [main, v2-architecture]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar interfaz gráfica
        run: >
          msbuild ONKOSFileTransfer/ONKOSFileTransfer.csproj
          /p:Configuration=Release
          /p:Platform=AnyCPU

      - name: Compilar servicio de Windows
        run: >
          msbuild ONKOSTransferService/ONKOSTransferService.csproj
          /p:Configuration=Release
          /p:Platform=AnyCPU

      - name: Verificar compilaciones
        shell: pwsh
        run: |
          $gui = "ONKOSFileTransfer/bin/Release/ONKOSFileTransfer.exe"
          $service = "ONKOSTransferService/bin/Release/ONKOS.TransferService.exe"
          if (!(Test-Path $gui)) { throw "No se encontró la interfaz: $gui" }
          if (!(Test-Path $service)) { throw "No se encontró el servicio: $service" }
          Get-Item $gui, $service | Select-Object FullName, Length

      - name: Preparar paquete de prueba
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Interfaz, package/Servicio | Out-Null
          Copy-Item "ONKOSFileTransfer/bin/Release/*" package/Interfaz/ -Recurse
          Copy-Item "ONKOSTransferService/bin/Release/*" package/Servicio/ -Recurse
          Copy-Item "ONKOSTransferService/README.md" package/Servicio/README-Instalacion.txt
          Compress-Archive -Path "package/*" -DestinationPath "ONKOS-File-Transfer-V2.zip" -Force

      # La cuota de almacenamiento de Actions está llena.
      # El ZIP se conserva como artefacto temporal solo cuando se solicita manualmente.
      - name: Publicar artefacto de compilación (opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && vars.ENABLE_ACTIONS_ARTIFACT_UPLOAD == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ONKOS-File-Transfer-V2
          path: ONKOS-File-Transfer-V2.zip
          if-no-files-found: error
          retention-days: 1

      - name: Publicar GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ONKOS File Transfer - Build ${{ github.run_number }}
          body: |
            Compilación automática de ONKOS File Transfer.
            Descarga el ZIP y extrae su contenido antes de ejecutar.
          files: ONKOS-File-Transfer-V2.zip
          make_latest: true
